<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitty Cat Cat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- MAIN CARD -->
  <div class="card">
    <img class="decor decor-top-cat" src="meow.png" alt="">
    <img class="decor decor-side-cat" src="meow2.png" alt="">

    <!-- corner paw decorations -->
    <span class="paw-top-left">🐾</span>
    <span class="paw-top-right">🐾</span>

    <h1>Student Score Evaluator</h1>
    <p class="subtitle">Check and See your remark!</p>

    <!-- mascot image-->
    <img class="mascot-slot" src="mascot.png" alt="">

    <div class="result-box" id="resultBox">Your result will appear here!</div>

    <div class="bottom-row">
      <span class="paw-bottom-left">🐾</span>
      <button class="evaluate-btn" id="evaluateBtn">
        <!-- icon image -->
        <img class="btn-icon-slot" src="icon.png" alt="">
        Evaluate Score
      </button>
      <span class="paw-bottom-right">🐾</span>
    </div>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
